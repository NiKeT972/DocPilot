[project]
name = "docpilot"
version = "1.0.0"
description = "Agentic PDF Q&A with page citations and web fallback"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel reads either).
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-text-splitters>=1.0",
  "httpx>=0.27",
  "pydantic>=2.8",
  "pypdf>=5.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["public", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

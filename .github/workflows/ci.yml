name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest (offline, no API keys)
        run: pytest -q

  e2e:
    # Optional browser smoke test against the fake-backed dev server.
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: npm install --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: python scripts/make_sample_pdf.py sample300.pdf 300
      - run: |
          python scripts/dev_fake.py &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          PDF=sample300.pdf node e2e/smoke.mjs
